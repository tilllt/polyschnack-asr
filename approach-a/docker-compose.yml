version: '3.8'

services:
  # Einziges hybrides Image (Weg 1): GPU via --gpus all bzw. NVIDIA-Toolkit,
  # ohne GPU-Zugriff automatisch CPU (onnxruntime-gpu → CPUExecutionProvider).
  polyschnack:
    build:
      context: .
      dockerfile: Dockerfile
    image: polyschnack-asr:latest
    container_name: polyschnack
    environment:
      POLYSNACK_USE_GPU: "auto"
      POLYSNACK_DEFAULT_MODEL: istupakov/parakeet-tdt-0.6b-v3-onnx
      POLYSNACK_BATCHED: "1"
      POLYSNACK_MAX_BATCH_SIZE: "4"
      POLYSNACK_BATCH_WINDOW_MS: "4"
      POLYSNACK_ORT_INTRA_THREADS: "1"
      POLYSNACK_AUDIO_WORKERS: "8"
    ports:
      - "5092:5092"
    volumes:
      - polyschnack-models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  polyschnack-models:
    name: polyschnack-models
