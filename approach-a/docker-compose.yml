version: '3.8'

services:
  # GPU deployment (default; requires NVIDIA Container Toolkit)
  polyschnack-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: polyschnack-asr:gpu
    container_name: polyschnack-gpu
    environment:
      POLYSNACK_USE_GPU: "true"
      POLYSNACK_DEFAULT_MODEL: istupakov/parakeet-tdt-0.6b-v3-onnx
      POLYSNACK_BATCHED: "1"
      POLYSNACK_MAX_BATCH_SIZE: "4"
      POLYSNACK_BATCH_WINDOW_MS: "4"
      POLYSNACK_ORT_INTRA_THREADS: "1"
      POLYSNACK_AUDIO_WORKERS: "8"
    ports:
      - "5092:5092"
    volumes:
      - polyschnack-models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # CPU-only deployment (explicit profile)
  polyschnack-cpu:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: polyschnack-asr:cpu
    container_name: polyschnack-cpu
    profiles: ["cpu"]
    environment:
      POLYSNACK_USE_GPU: "false"
      POLYSNACK_DEFAULT_MODEL: parakeet-tdt-0.6b-v3
      POLYSNACK_BATCHED: "0"
      # Serialize chunk inference: parallel ORT sessions multiply the model
      # working set and OOM-kill the process in a small (~3GB) Docker VM.
      POLYSNACK_INFER_WORKERS: "1"
      # 120s windows + 15s overlap keep encoder memory bounded on small hosts.
      POLYSNACK_CHUNK_SECONDS: "120"
      POLYSNACK_CHUNK_OVERLAP_SECONDS: "15"
    ports:
      - "5092:5092"
    volumes:
      - polyschnack-models:/app/models
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  polyschnack-models:
    name: polyschnack-models
