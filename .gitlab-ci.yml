stages:
  - test
  - build
  - pages

pages:
  stage: pages
  image: python:3.12-slim
  tags:
    - shared
  script:
    - pip install -q -r docs/requirements.txt 2>/dev/null
    - mkdocs build -f docs/mkdocs.yml --strict
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - docs/**/*

test-core:
  stage: test
  image: python:3.11-slim
  tags:
    - shared
  script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null 2>&1
    - pip install -q numpy pytest 2>/dev/null
    - cd approach-a && POLYSCHNACK_DEFAULT_MODEL=parakeet-tdt-0.6b-v3 python -m pytest tests/ -v --tb=short
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - approach-a/**/*

test-webapp:
  stage: test
  image: python:3.13-slim
  tags:
    - shared
  script:
    # Change 076-Fix (CI 4290): die Set-Discovery/Installer-Tests brauchen
    # git (ls-remote/clone) — python:3.13-slim hat kein git.
    - apt-get update -qq && apt-get install -y -qq ffmpeg git > /dev/null 2>&1
    - pip install -q pytest httpx fastapi "sqlmodel>=0.0.16" "pydantic>=2" python-multipart numpy cryptography authlib itsdangerous pyyaml pycrdt pycrdt-websocket 2>/dev/null
    - cd webapp && python -m pytest tests/ -v --tb=short
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - webapp/**/*

test-frontend:
  stage: test
  image: node:20-slim
  tags:
    - shared
  script:
    - cd webapp/frontend
    - npm install --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund
    - npm test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - webapp/frontend/**/*

build-qwen3:
  timeout: 60 minutes
  stage: build
  image: ${HARBOR_REGISTRY}/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json
    # Hybrid-Image (Weg 1): CUDA-Build mit CPU-Fallback — läuft auf GPU
    # (compose.gpu.yml-Overlay) UND CPU (Default), kein :cpu-Tag mehr.
    bash scripts/ci_smart_build.sh "${HARBOR_REGISTRY}/public" "${CI_PROJECT_NAME}-qwen3" "qwen3-asr-cpp/"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - qwen3-asr-cpp/**/*
  tags:
    - shared
  needs:
    - job: test-webapp
      optional: true

build-ark:
  stage: build
  image: ${HARBOR_REGISTRY}/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json
    # Hybrid-Image (Weg 1): CrispASR-CUDA-Binary mit CPU-Fallback
    # (ggml_backend_init_best) — kein :cpu-Tag mehr nötig.
    bash scripts/ci_smart_build.sh "${HARBOR_REGISTRY}/public" "${CI_PROJECT_NAME}-ark" "ark-asr-cpp/"
  rules:
