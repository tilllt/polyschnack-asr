stages:
  - test
  - build

test-core:
  stage: test
  image: python:3.11-slim
  tags:
    - shared
  script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg > /dev/null 2>&1
    - pip install -q numpy pytest 2>/dev/null
    - cd approach-a && POLYSCHNACK_DEFAULT_MODEL=parakeet-tdt-0.6b-v3 python -m pytest tests/ -v --tb=short
  only:
    - main

test-webapp:
  stage: test
  image: python:3.13-slim
  tags:
    - shared
  script:
    - pip install -q pytest httpx fastapi "sqlmodel>=0.0.16" "pydantic>=2" python-multipart numpy cryptography authlib itsdangerous 2>/dev/null
    - cd webapp && python -m pytest tests/ -v --tb=short
  only:
    - main

build-qwen3:
  timeout: 60 minutes
  stage: build
  image: registry.example.com/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json

    docker build \
      -t registry.example.com/public/${CI_PROJECT_NAME}-qwen3:latest \
      -t registry.example.com/public/${CI_PROJECT_NAME}-qwen3:${CI_COMMIT_SHORT_SHA} \
      qwen3-asr-cpp/

    docker push registry.example.com/public/${CI_PROJECT_NAME}-qwen3:latest
    docker push registry.example.com/public/${CI_PROJECT_NAME}-qwen3:${CI_COMMIT_SHORT_SHA}
  only:
    - main
  tags:
    - shared
  needs:
    - test-webapp

build-ark:
  stage: build
  image: registry.example.com/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json

    docker build \
      -t registry.example.com/public/${CI_PROJECT_NAME}-ark:latest \
      -t registry.example.com/public/${CI_PROJECT_NAME}-ark:${CI_COMMIT_SHORT_SHA} \
      ark-asr-cpp/

    docker push registry.example.com/public/${CI_PROJECT_NAME}-ark:latest
    docker push registry.example.com/public/${CI_PROJECT_NAME}-ark:${CI_COMMIT_SHORT_SHA}
  only:
    - main
  tags:
    - shared
  needs:
    - test-webapp

build-gpu:
  timeout: 60 minutes
  stage: build
  image: registry.example.com/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json

    docker build \
      -t registry.example.com/public/${CI_PROJECT_NAME}:latest \
      -t registry.example.com/public/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA} \
      -f approach-a/Dockerfile.gpu \
      approach-a/

    docker build \
      -t registry.example.com/public/${CI_PROJECT_NAME}-webapp:latest \
      -t registry.example.com/public/${CI_PROJECT_NAME}-webapp:${CI_COMMIT_SHORT_SHA} \
      webapp/

    docker push registry.example.com/public/${CI_PROJECT_NAME}:latest
    docker push registry.example.com/public/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
    docker push registry.example.com/public/${CI_PROJECT_NAME}-webapp:latest
    docker push registry.example.com/public/${CI_PROJECT_NAME}-webapp:${CI_COMMIT_SHORT_SHA}
  only:
    - main
  tags:
    - shared
  needs:
    - test-core
    - test-webapp
