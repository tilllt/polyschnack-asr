# (CUDA-Binary mit CPU-Fallback via ggml_backend_init_best). Kein
# build-cpu-backends-Job mehr nötig — build-qwen3/build-ark bauen die
# einzigen Images, die auf GPU (Overlay) UND CPU (Default) laufen.

# Compose-Dateien syntaktisch validieren (base + gpu-Overlay + backends)
compose-validate:
  stage: test
  image: python:3.13-slim
  tags:
    - shared
  script: |
    pip install -q pyyaml > /dev/null 2>&1
    python - <<'EOF'
    import yaml
    for f in ("compose.yml", "compose.gpu.yml", "compose.backends.yml"):
        yaml.safe_load(open(f))
        print(f, "OK")
    EOF
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - compose*.yml

# ---------------------------------------------------------------------------
# GitHub-Sync: erst NACH erfolgreicher GitLab-CI (alle Test- + Build-Jobs
# gruen). Die mirror-Jobs haengen per needs an jedem Job der Pipeline.
# ---------------------------------------------------------------------------

# GitHub-Mirror: spiegelt main nach github.com/tilllt/polyschnack-asr (public).
# Der Push triggert dort die GitHub-Actions-CI (.github/workflows/ci.yml).
# Token: CI-Variable GH_MIRROR_TOKEN (GitHub-PAT mit repo-Scope).
# --force: nach dem History-Rewrite (2026-08-14, private Infos aus Messages/
# Blobs entfernt) ersetzt die bereinigte History den alten GitHub-Stand;
# bei normalen Pushes ist force identisch zu fast-forward (harmlos).
# Image: alpine + git per apk (alpine/git hat ENTRYPOINT ["git"], was den
# Runner-Script-Start als "git sh -c …" brechen wuerde).
mirror-github:
  stage: build
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git > /dev/null 2>&1
  script: |
    git remote add github "https://tilllt:${GH_MIRROR_TOKEN}@github.com/tilllt/polyschnack-asr.git" 2>/dev/null \
      || git remote set-url github "https://tilllt:${GH_MIRROR_TOKEN}@github.com/tilllt/polyschnack-asr.git"
    git push --force github HEAD:main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - shared
  needs:
    - job: test-core
      optional: true
    - job: test-webapp
      optional: true
    - job: test-frontend
      optional: true
    - job: compose-validate
      optional: true
    - job: build-asr
      optional: true
    - job: build-webapp
      optional: true
    - job: build-qwen3
      optional: true
    - job: build-ark
      optional: true
    - job: build-diar
      optional: true
    - job: build-aligner
      optional: true
    - job: build-sep
      optional: true
    - job: build-cpp
      optional: true
    - job: build-moonshine-de
      optional: true
    - job: build-canary
      optional: true
    - job: build-whisper
      optional: true
    - job: build-voxtral
      optional: true
    - job: build-whisper-crisp
      optional: true

# GHCR-Mirror: spiegelt alle 12 Images von Harbor nach ghcr.io/tilllt/…
# (public) — externe Nutzer des GitHub-Repos ziehen ihre Images von dort,
# Harbor bleibt die private Dev-Registry. Tags: latest + SHA. Die Builds sind
# idempotent (ci_smart_build.sh: SHA-Guard) — ein Re-Run derselben Pipeline
# baut nichts neu, der Mirror pusht nur die vorhandenen Tags erneut.
# Token: CI-Variablen GHCR_USER=tilllt + GHCR_TOKEN (GitHub-PAT write:packages);
# Paket-Sichtbarkeit ist per GitHub-API auf public gesetzt.
mirror-ghcr:
  stage: build
  image: ${HARBOR_REGISTRY}/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json
    echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
    for img in "" -webapp -qwen3 -ark -diar -aligner -sep -cpp -moonshine-de -canary -whisper -voxtral -whisper-crisp; do
      src="${HARBOR_REGISTRY}/public/${CI_PROJECT_NAME}${img}"
      dst="ghcr.io/${GHCR_USER}/${CI_PROJECT_NAME}${img}"
      docker pull "${src}:latest"
      docker tag "${src}:latest" "${dst}:latest"
      # Multi-Arch-Index in Harbor → nur die gebaute Plattform spiegeln
      # (go-containerregistry bricht sonst mit "not all manifests available
      # locally" ab, wenn der lokale Cache nur eine Plattform hat).
      docker push --platform linux/amd64 "${dst}:latest"
      # SHA-Tag nur spiegeln, wenn das Image in dieser Pipeline (oder fuer
      # diesen SHA) gebaut wurde — seit Change 117 bauen nicht mehr alle
      # Images bei jedem Push (changes-Filter).
      if docker manifest inspect "${src}:${CI_COMMIT_SHORT_SHA}" >/dev/null 2>&1; then
        docker tag "${src}:${CI_COMMIT_SHORT_SHA}" "${dst}:${CI_COMMIT_SHORT_SHA}"
        docker push --platform linux/amd64 "${dst}:${CI_COMMIT_SHORT_SHA}"
      else
        echo "[mirror-ghcr] kein SHA-Tag ${CI_COMMIT_SHORT_SHA} fuer ${src} — uebersprungen"
      fi
    done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - shared
  needs:
    - job: test-core
      optional: true
    - job: test-webapp
      optional: true
    - job: test-frontend
      optional: true
    - job: compose-validate
      optional: true
    - job: build-asr
      optional: true
    - job: build-webapp
      optional: true
    - job: build-qwen3
      optional: true
    - job: build-ark
      optional: true
    - job: build-diar
      optional: true
    - job: build-aligner
      optional: true
    - job: build-sep
      optional: true
    - job: build-cpp
      optional: true
    - job: build-moonshine-de
      optional: true
    - job: build-canary
      optional: true
    - job: build-whisper
      optional: true
    - job: build-voxtral
      optional: true
    - job: build-whisper-crisp
      optional: true
