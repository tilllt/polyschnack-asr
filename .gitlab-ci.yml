# ASR-GPU-Image (approach-a, ONNX + CUDA) — das Kern-Backend pk-python.
# Eigener Job, damit der Webapp-Build nicht hinter dem 60-min-CUDA-Build wartet.
build-asr:
  timeout: 60 minutes
  stage: build
  image: registry.example.com/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json

    docker build \
      -t registry.example.com/public/${CI_PROJECT_NAME}:latest \
      -t registry.example.com/public/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA} \
      -f approach-a/Dockerfile \
      approach-a/

    docker push registry.example.com/public/${CI_PROJECT_NAME}:latest
    docker push registry.example.com/public/${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}
  only:
    - main
  tags:
    - shared
  needs:
    - test-core

# Webapp-Image — seit Option B CPU-only (kein CUDA-torch/pyannote mehr),
# baut deshalb parallel zum ASR-GPU-Image statt dahinter zu warten.
build-webapp:
  stage: build
  image: registry.example.com/public/ci-tools
  script: |
    mkdir ~/.docker
    cp ${CONFIG_JSON} ~/.docker/config.json

    docker build \
      -t registry.example.com/public/${CI_PROJECT_NAME}-webapp:latest \
      -t registry.example.com/public/${CI_PROJECT_NAME}-webapp:${CI_COMMIT_SHORT_SHA} \
      webapp/

    docker push registry.example.com/public/${CI_PROJECT_NAME}-webapp:latest
    docker push registry.example.com/public/${CI_PROJECT_NAME}-webapp:${CI_COMMIT_SHORT_SHA}
  only:
    - main
  tags:
    - shared
  needs:
    - test-webapp

# CPU-Varianten entfallen seit Weg 1: alle Backend-Images sind hybrid
# (CUDA-Binary mit CPU-Fallback via ggml_backend_init_best). Kein
# build-cpu-backends-Job mehr nötig — build-qwen3/build-ark bauen die
# einzigen Images, die auf GPU (Overlay) UND CPU (Default) laufen.

# Compose-Dateien syntaktisch validieren (base + gpu-Overlay + backends)
compose-validate:
  stage: test
  image: python:3.13-slim
  tags:
    - shared
  script: |
    pip install -q pyyaml > /dev/null 2>&1
    python - <<'EOF'
    import yaml
    for f in ("compose.yml", "compose.gpu.yml", "compose.backends.yml"):
        yaml.safe_load(open(f))
        print(f, "OK")
    EOF
  only:
    - main
