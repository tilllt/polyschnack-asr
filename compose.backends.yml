# PolySchnack — optionale ASR-Backends (NICHT Teil der Main-Compose).
#
# Mechanismus: Docker-Profile. Backends sind definiert, starten aber NUR,
# wenn ihr Profil aktiviert wird. Die Admin-GUI der Webapp kann die Container
# trotzdem on demand starten/stoppen (über den Docker-Socket-Proxy).
#
# HYBRID (Weg 1): Jedes Backend ist EIN Image für GPU UND CPU — das
# CUDA/ggml-Binary enthält den CPU-Backend (ggml_backend_init_best =
# CUDA > Metal > Vulkan > CPU bzw. onnxruntime auto-detect). Ohne
# compose.gpu.yml-Overlay läuft der Container automatisch auf CPU, mit
# Overlay auf GPU. Es gibt KEINE separaten CPU-Varianten mehr.
#
# Aktivieren (Container erzeugen, ohne zu starten — die GUI startet on demand):
#   docker compose -f compose.yml -f compose.backends.yml \
#     --profile crispr-pk-cpp --profile crispr-qwen3 --profile crispr-ark up -d --no-start
#
# Oder direkt mitstarten:
#   docker compose -f compose.yml -f compose.backends.yml \
#     --profile crispr-pk-cpp --profile crispr-qwen3 --profile crispr-ark up -d
#
# GPU: zusätzlich -f compose.gpu.yml (setzt runtime: nvidia für alle Dienste).
# Warum keine docker-compose.override.yml? Overrides werden IMMER automatisch
# gemergt — die Backends wären dann dauerhaft Teil des Stacks. Profile halten
# sie optional, ohne die Datei-Struktur zu verkomplizieren.
services:
  crispr-pk-cpp:
    profiles: ["crispr-pk-cpp"]
    # Weg 1: eigenes hybrides CrispASR-Image (parakeet-Backend, CUDA-Binary
    # mit CPU-Fallback) statt externem mudler/parakeet.cpp-server.
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-cpp:latest
    environment:
      CPP_ASR_MODEL: /models/parakeet-tdt-0.6b-v3-q8_0.gguf
      # Residenter Post-Prozessor (Server-Flag): Interpunktion + deutsches
      # Truecasing (fullstop = EN/DE/FR/IT, lstm = DE) — parakeet emittiert
      # selbst keine Satzzeichen, der Server restauriert sie.
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      # Gemeinsamer Modell-Ordner ./DATA/models (alle Backends + diar)
      - ./DATA/models:/models:ro
    ports:
      - "5093:5093"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  crispr-qwen3:
    profiles: ["crispr-qwen3"]
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-qwen3:latest
    environment:
      QWEN3_ASR_MODEL: /models/qwen3-asr-0.6b-q8_0.gguf
      QWEN3_ALIGNER_MODEL: /models/qwen3-forced-aligner-0.6b-f16.gguf
      # Residenter Post-Prozessor (Server-Flag): Interpunktion + deutsches
      # Truecasing für JEDE Transkription (CrispASR --punc-model fullstop
      # = EN/DE/FR/IT, --truecase-model lstm = DE, 97,9 % F1). Modelle lädt
      # der Server automatisch (auto-download nach ~/.cache/crispasr).
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      - ./DATA/models:/models:ro
    ports:
      - "5094:5094"
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5094/v1/audio/transcriptions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crispr-ark:
    profiles: ["crispr-ark"]
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-ark:latest
    environment:
      ARK_ASR_MODEL: /models/ark-asr-3b-q8_0.gguf
      # Residenter Post-Prozessor (Server-Flag): Interpunktion + deutsches
      # Truecasing (fullstop = EN/DE/FR/IT, lstm = DE) — lädt der Server
      # automatisch (auto-download nach ~/.cache/crispasr).
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      - ./DATA/models:/models:ro
    ports:
      - "5095:5095"
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  crispr-moonshine-de:
    profiles: ["crispr-moonshine-de"]
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-moonshine-de:latest
    environment:
      MOONSHINE_DE_MODEL: /models/moonshine-base-de-fidoriel-q4_k.gguf
      # Deutsches Spezialmodell (61,5M, 6,9% WER CV22-de, ~39 MB GGUF).
      # Residenter Post-Prozessor: Interpunktion + deutsches Truecasing.
      # ⚠ Lizenz CC-BY-NC-SA-4.0 (nicht-kommerziell!) — siehe README.
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      - ./DATA/models:/models:ro
    ports:
      - "5096:5096"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  crispr-canary:
    profiles: ["crispr-canary"]
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-canary:latest
    environment:
      CANARY_ASR_MODEL: /models/canary-1b-v2-q4_k.gguf
      # Multilingual (EN/DE/FR/ES). Residenter Post-Prozessor:
      # Interpunktion + deutsches Truecasing.
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      - ./DATA/models:/models:ro
    ports:
      - "5097:5097"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5097/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  crispr-voxtral:
    profiles: ["crispr-voxtral"]
    # Change 029: CrispASR voxtral4b (Voxtral-Mini-4B-Realtime-2602, Q8_0)
    # statt vLLM — CrispASR-Hybrid (CUDA-Binary mit CPU-Fallback).
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-voxtral:latest
    environment:
      VOXTRAL_ASR_MODEL: /models/voxtral-mini-4b-realtime-q8_0.gguf
      # Residenter Post-Prozessor: Interpunktion + deutsches Truecasing.
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      - ./DATA/models:/models:ro
    ports:
      - "5100:5100"
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  crispr-whisper:
    profiles: ["crispr-whisper"]
    # Change 029: CrispASR whisper (ggml-large-v3-turbo-q5_0.bin) —
    # zusätzliche Whisper-Option neben faster-whisper (build-whisper).
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-whisper-crisp:latest
    environment:
      WHISPER_ASR_MODEL: /models/ggml-large-v3-turbo-q5_0.bin
      CRISPASR_EXTRA_ARGS: "--punc-model fullstop --truecase-model lstm"
    volumes:
      - ./DATA/models:/models:ro
    ports:
      - "5101:5101"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
