# PolySchnack — Backend-/Adapter-Definitionen (single source of truth).
#
# Diese Datei ersetzt die früher hartkodierte SERVICES-Liste in
# service_registry.py: Jedes Backend wird hier deklarativ beschrieben —
# Metadaten (Name, Compose-Profil, Container, Ressourcen) UND die
# Adapter-Verdrahtung (welche Klasse, welche URL). Neues Backend =
# neuer YAML-Block + Adapter-Klasse; kein Code-Change in der Verdrahtung.
#
# Felder:
#   name              eindeutige ID (Backend-ID, ASR_BACKEND-Wert)
#   backend           identisch zu name (Backend-ID)
#   compose_profile   Docker-Compose-Profil (default | cpp | qwen3 | ark | …)
#   container_name    Docker-Container-Name (muss zu compose.yml passen)
#   type              local | remote
#   cost_per_minute_eur  Selbstkosten pro Minute (Benchmark-Pricing)
#   concurrency       Endpunkt-Kapazität (Queue leitet daraus ab)
#   model             Beschreibung des geladenen Modells (Freitext)
#   model_files       Map Dateiname -> Download-URL (single source of truth
#                     fuer ./polyschnack-manage.sh models). Nur Backends mit
#                     GGUFs, die extern geseedet werden muessen. Backends ohne
#                     model_files laden ihre Modelle selbst (z. B. ONNX).
#   license           optionale Lizenz-Warnung (wird bei `models` angezeigt)
#   url               Compose-Netzwerk-URL des Containers (optional,
#                     Defaults siehe Adapter-Klasse)
#   health_url        "" → settings.ASR_URL; nur eigene Server melden VRAM
#   requires          Ressourcen-Check vor Start (vram/ram/disk in GB)
#   capabilities      Feature-Matrix (GUI + /api/models/matrix)
#   status            active (nimmt Jobs an) | disabled
#   adapter           Modul:Klassenname der Adapter-Klasse (importlib)
#   adapter_kwargs    optionale Konstruktor-Argumente (z. B. capabilities-
#                     Override für CrispASR-Derivate)

services:
  - name: ps-pk-onnx
    backend: ps-pk-onnx
    compose_profile: default
    type: local
    port: 5092
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: parakeet-tdt-0.6b-v3-onnx
    health_url: ""
    requires: {vram_gb: 6, ram_gb: 8, disk_gb: 5}
    # VRAM-Prognose (2026-08-14): sichere Dauer-Obergrenze pro Backend.
    # ps-pk-onnx chunkt in 120-s-Fenstern mit begrenzter Nebenläufigkeit —
    # der VRAM-Bedarf skaliert NICHT mit der Dateilänge, 8 h sind daher
    # eine großzügige Queue-Grenze (kein OOM-Schutz). streaming_advice=true
    # → Live-Modus als Empfehlung, wenn die Grenze überschritten wird.
    long_audio: {max_safe_duration_s: 28800, streaming_advice: true}
    capabilities:
      word_timestamps: true
      streaming: true
      async_jobs: true
      noise_reduce: true
      vad: external
      diarization: external
      enhance: true
      languages: [de, en]
      device: [gpu, cpu]
    status: active
    adapter: app.asr_client.adapters.pk_python:PkPythonClient

  - name: crispr-pk-cpp
    backend: crispr-pk-cpp
    compose_profile: crispr-pk-cpp
    type: local
    port: 5093
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: parakeet-tdt-0.6b-v3-q8_0.gguf
    model_files:
      parakeet-tdt-0.6b-v3-q8_0.gguf: https://huggingface.co/cstr/parakeet-tdt-0.6b-v3-GGUF/resolve/main/parakeet-tdt-0.6b-v3-q8_0.gguf
    requires: {vram_gb: 2, ram_gb: 4, disk_gb: 2}
    long_audio: {auto_vram: true, vram_per_minute_gb: 0.04, vram_safety_gb: 2, max_safe_duration_s: 7200, streaming_advice: false}
    capabilities:
      word_timestamps: true   # gleiches Modell wie ps-pk-onnx, Timestamps modell-inhärent
      streaming: false
      async_jobs: false
      noise_reduce: false
      vad: external
      diarization: external
      enhance: true
      languages: [de, en]
      device: [gpu, cpu]
    status: active
    adapter: app.asr_client.adapters.pk_cpp:PkCppClient

  - name: crispr-qwen3
    backend: crispr-qwen3
    compose_profile: crispr-qwen3
    type: local
    port: 5094
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: qwen3-asr-0.6b-q8_0.gguf + forced-aligner
    model_files:
      qwen3-asr-0.6b-q8_0.gguf: https://huggingface.co/OpenVoiceOS/qwen3-asr-0.6b-q8-0/resolve/main/qwen3-asr-0.6b-q8_0.gguf
      qwen3-forced-aligner-0.6b-f16.gguf: https://huggingface.co/OpenVoiceOS/qwen3-forced-aligner-0.6b-f16/resolve/main/qwen3-forced-aligner-0.6b-f16.gguf
    requires: {vram_gb: 3, ram_gb: 6, disk_gb: 4}
    long_audio: {auto_vram: true, vram_per_minute_gb: 0.04, vram_safety_gb: 2, max_safe_duration_s: 7200, streaming_advice: false}
    capabilities:
      word_timestamps: true   # via forced aligner
      streaming: false
      async_jobs: false
      noise_reduce: false
      vad: external
      diarization: external
      enhance: true
      languages: [de, en]
      device: [gpu, cpu]
    status: active
    adapter: app.asr_client.adapters.qwen3_asr_http:Qwen3AsrHttpClient

  - name: crispr-ark
    backend: crispr-ark
    compose_profile: crispr-ark
    type: local
    port: 5095
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: ark-asr-3b-q8_0.gguf
    model_files:
      ark-asr-3b-q8_0.gguf: https://huggingface.co/cstr/ark-asr-3b-GGUF/resolve/main/ark-asr-3b-q8_0.gguf
    requires: {vram_gb: 5, ram_gb: 6, disk_gb: 4}
    long_audio: {auto_vram: true, vram_per_minute_gb: 0.04, vram_safety_gb: 2, max_safe_duration_s: 7200, streaming_advice: false}
    capabilities:
      word_timestamps: true   # CrispASR verbose_json liefert word-level
      streaming: false
      async_jobs: false
      noise_reduce: false
      vad: external
      diarization: external
      enhance: true
      languages: [de, en]
      device: [gpu, cpu]
    status: active
    adapter: app.asr_client.adapters.crisp_asr_http:CrispAsrHttpClient

  - name: ps-voxtral
    backend: ps-voxtral
    compose_profile: ps-voxtral
    type: local
    port: 5099
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: Voxtral-Mini-4B-Realtime-2602 (Q4_K_M)
    requires: {vram_gb: 5, ram_gb: 6, disk_gb: 4}
    long_audio: {max_safe_duration_s: 7200, streaming_advice: true}
    capabilities:
      word_timestamps: "verify"      # Mistral: nicht für Timestamps trainiert (vermutlich False)
      streaming: true                # Realtime-Modell: 1 Token je 80-ms-Frame
      async_jobs: false
      noise_reduce: false
      vad: external
      diarization: external
      enhance: true
      languages: [de, en]
      device: [gpu]
    status: active
    adapter: app.asr_client.adapters.pk_python:PkPythonClient
    adapter_kwargs:
      api_key_env: POLYSCHNACK_VOXTRAL_API_KEY   # optionaler API-Key (voxtral.cpp)
    capabilities_override:                       # PkPythonClient ohne ctor-Param → nachträglich setzen
      word_timestamps: false
      streaming: true
      async_jobs: false
      noise_reduce: false
      languages: [de, en]
      device: [gpu]

  - name: crispr-moonshine-de
    backend: crispr-moonshine-de
    compose_profile: crispr-moonshine-de
    type: local
    port: 5096
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: moonshine-base-de-fidoriel-q4_k.gguf (61.5M, DE-Spezial, 6.9% WER CV22-de)
    model_files:
      moonshine-base-de-fidoriel-q4_k.gguf: https://huggingface.co/cstr/moonshine-base-de-fidoriel-GGUF/resolve/main/moonshine-base-de-fidoriel-q4_k.gguf
      tokenizer.bin: https://huggingface.co/cstr/moonshine-base-de-fidoriel-GGUF/resolve/main/tokenizer.bin
    license: cc-by-nc-sa-4.0    # nicht-kommerziell
    requires: {vram_gb: 1, ram_gb: 2, disk_gb: 1}
    long_audio: {auto_vram: true, vram_per_minute_gb: 0.04, vram_safety_gb: 2, max_safe_duration_s: 7200, streaming_advice: false}
    capabilities:
      word_timestamps: true   # CrispASR verbose_json, -ml 1
      streaming: false
      async_jobs: false
      noise_reduce: false
      vad: external
      diarization: external
      enhance: true
      languages: [de]
      device: [gpu, cpu]
    status: active
    adapter: app.asr_client.adapters.crisp_asr_http:CrispAsrHttpClient

  - name: crispr-canary
    backend: crispr-canary
    compose_profile: crispr-canary
    type: local
    port: 5097
    cost_per_minute_eur: 0.0
    concurrency: 1
    model: canary-1b-v2-q4_k.gguf (multilingual EN/DE/FR/ES)
    model_files:
      canary-1b-v2-q4_k.gguf: https://huggingface.co/cstr/canary-1b-v2-GGUF/resolve/main/canary-1b-v2-q4_k.gguf
    requires: {vram_gb: 2, ram_gb: 4, disk_gb: 2}
    long_audio: {auto_vram: true, vram_per_minute_gb: 0.04, vram_safety_gb: 2, max_safe_duration_s: 7200, streaming_advice: false}
    capabilities:
      word_timestamps: true   # CrispASR verbose_json, -ml 1
      streaming: false
      async_jobs: false
      noise_reduce: false
      vad: external
      diarization: external
      enhance: true
      languages: [de, en, fr, es]
      device: [gpu, cpu]
    status: active
    adapter: app.asr_client.adapters.crisp_asr_http:CrispAsrHttpClient

  # ===================================================================
  # REMOTE-BACKENDS (type: remote) — auskommentierte Beispiele
  # ===================================================================
  # Aktivieren: Block einkommentieren (Einrueckung beachten: 2 Leerzeichen
  # vor "- name"), status: active, und den API-Key als Env-Variable in der
  # Container-Env des webapp-Service setzen (z. B. OPENAI_API_KEY in
  # compose.yml oder der lokalen .env — NIE ins YAML/Repo).
  # URL-Aufloesung: base_url (adapter_kwargs) oder Env <ID>_URL
  # (z. B. REMOTE_OPENAI_WHISPER_URL). Kein Compose-Profil/Container noetig.
  #
  # WICHTIG: Fuer Remote-Backends gibt es keinen Start/Stop-Button in der
  # Admin-GUI (kein Container) — Status kommt direkt von der API. Die
  # Modell-/Preisangaben sind Beispielwerte (Stand 2026-08) — vor Nutzung
  # gegen die Anbieter-Doku pruefen!

