[project]
name = "polyschnack-webapp"
version = "0.1.0"
description = "Minimal PoC UI for the PolySchnack ASR server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "numpy>=2.5.2",
    # Change 060: VAD direkt via onnxruntime (silero_vad.onnx) — das
    # PyPI-Paket silero-vad zog torch+torchaudio transitiv ins Image
    # (~2,5 GB Ballast); onnxruntime ist der schlanke CPU-Runtime.
    "onnxruntime>=1.18",
    # Change 053: kollaboratives Transkriptions-Editing (Yjs-CRDT-Sync)
    "pycrdt>=0.14.3",
    "pycrdt-websocket>=0.16.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
