[project]
name = "polyschnack-webapp"
version = "0.1.0"
description = "Minimal PoC UI for the PolySchnack ASR server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "silero-vad>=6.0.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
