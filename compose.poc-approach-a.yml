# Unified PoC stack: ASR service (approach-a) + minimal web UI.
#   docker compose up -d --build
#   UI:  http://localhost:8088
#   ASR: http://localhost:5092  (direct, for debugging)
services:
  asr:
    build:
      context: ./approach-a
      dockerfile: Dockerfile
    image: polyschnack-asr:latest
    container_name: poc-asr
    environment:
      POLYSCHNACK_USE_GPU: "false"
      POLYSCHNACK_DEFAULT_MODEL: parakeet-tdt-0.6b-v3
      POLYSCHNACK_BATCHED: "0"
      # Memory caps for small hosts (see approach-a/POC_NOTES.md); 120s windows
      # keep the encoder activation footprint bounded on ~3GB VMs.
      POLYSCHNACK_CHUNK_SECONDS: "120"
      POLYSCHNACK_CHUNK_OVERLAP_SECONDS: "15"
      POLYSCHNACK_INFER_WORKERS: "1"
    ports:
      - "5092:5092"
    volumes:
      - polyschnack-models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  webapp:
    build:
      context: ./webapp
    image: polyschnack-webapp:latest
    container_name: poc-webapp
    environment:
      ASR_URL: "http://asr:5092"
      ASR_MODEL: parakeet-tdt-0.6b-v3
      DATA_DIR: /data
    ports:
      - "8088:8080"
    volumes:
      - poc-data:/data
    depends_on:
      - asr
    restart: unless-stopped

volumes:
  # Reuse the already-downloaded model cache from the approach-a runs.
  polyschnack-models:
    external: true
    name: polyschnack-models
  poc-data:
    name: poc-data
