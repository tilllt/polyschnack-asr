services:
  asr:
    image: registry.example.com/public/polyschnack-asr:latest
    container_name: polyschnack-asr
    environment:
      POLYSNACK_USE_GPU: "true"
      POLYSNACK_DEFAULT_MODEL: istupakov/parakeet-tdt-0.6b-v3-onnx
      POLYSNACK_INFER_WORKERS: "1"
    ports:
      - "5092:5092"
    volumes:
      - polyschnack-models:/app/models
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  asr-cpp:
    profiles: ["cpp"]
    image: ghcr.io/mudler/parakeet.cpp-server:latest-cuda
    container_name: polyschnack-cpp
    runtime: nvidia
    environment:
      MODEL: /models/parakeet-tdt-0.6b-v3-q8_0.gguf
    volumes:
      - cpp-models:/models:ro
    ports:
      - "5093:8080"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/audio/transcriptions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  qwen3-asr:
    profiles: ["qwen3"]
    image: registry.example.com/public/qwen3-asr-cpp:latest
    container_name: qwen3-asr
    runtime: nvidia
    environment:
      QWEN_USE_VRAM: "1"
      QWEN3_ASR_MODEL: /models/qwen3-asr-0.6b-q8_0.gguf
      QWEN3_ALIGNER_MODEL: /models/qwen3-forced-aligner-0.6b-f16.gguf
    volumes:
      - qwen3-models:/models:ro
    ports:
      - "5094:8080"
    deploy:
      resources:
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/audio/transcriptions"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ark-asr:
    profiles: ["ark"]
    image: registry.example.com/public/ark-asr-cpp:latest
    container_name: ark-asr
    runtime: nvidia
    environment:
      CRISPASR_CLI: /usr/local/bin/crispasr
      ARK_ASR_MODEL: /models/ark-asr-3b-q8_0.gguf
    volumes:
      - ark-models:/models:ro
    deploy:
      resources:
        limits:
          memory: 6G

  webapp:
    image: registry.example.com/public/polyschnack-asr-webapp:latest
    container_name: polyschnack-webapp
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      ASR_URL: "${ASR_URL:-http://asr:5092}"
      ASR_BACKEND: "${ASR_BACKEND:-pk-python}"
      ASR_MODEL: istupakov/parakeet-tdt-0.6b-v3-onnx  # → GPU model
      DATA_DIR: /data
      HF_TOKEN: ""                       # ← Setzen für Speaker Diarization
      VAD_TRIM_SILENCE: "false"   # Set "true" to strip leading/trailing silence before ASR
      PUBLIC_RETENTION_MINUTES: "60"  # Auto-delete public recordings after N min (0=off)
      # Optional OIDC — uncomment to enable per-user workspaces
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_ISSUER: "https://auth.example.com"   # or your Keycloak/Authentik URL
      # OIDC_SCOPE: "openid profile email"
      # SESSION_SECRET: "generate-a-random-secret-here"
      # BASE_URL: "https://polyschnack.example.com"
    ports:
      - "8088:8080"
    volumes:
      - poc-data:/data
    depends_on:
      asr:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  polyschnack-models:
  cpp-models:
  qwen3-models:
  ark-models:
  poc-data:
