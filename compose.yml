# PolySchnack — Main-Compose: GUI + ONNX-ASR (Kern-Stack).
#   docker compose up -d          # Kern: docker-proxy + asr (ONNX) + webapp
#   UI:  http://localhost:8088
#   ASR: http://localhost:5092  (direct, for debugging)
#
# Optionale Backends (parakeet.cpp, Qwen3, ARK, Voxtral) liegen in
# compose.backends.yml und werden über Docker-Profile aktiviert:
#   docker compose -f compose.yml -f compose.backends.yml \
#     --profile crispr-pk-cpp --profile crispr-qwen3 --profile crispr-ark up -d --no-start
# (Erzeugt die Container, damit die Admin-GUI sie on demand starten kann.)
#
# OIDC-Login + Admin-Bereich (optional) über das Dummy-Overlay:
#   docker compose -f compose.yml -f compose.oidc.yml up -d
# (Alle Werte in compose.oidc.yml sind Platzhalter — vor Produktion ersetzen.)
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    environment:
      CONTAINERS: "1"   # GET/POST /containers/* (start/stop/restart/json/logs)
      INFO: "1"         # GET /info (host RAM/CPU for the resource check)
      POST: "1"         # allow POST actions
      # Events/Exec/Create bewusst NICHT freigeschaltet (restriktiv)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  ps-pk-onnx:
    image: registry.example.com/public/polyschnack-asr:latest
    environment:
      # Hybrid: "auto" = GPU wenn CUDA-Provider verfügbar, sonst CPU-INT8.
      # Explizit "true" (mit GPU-Zugriff) setzt nur das GPU-Overlay
      # compose.gpu.yml (runtime: nvidia).
      POLYSCHNACK_USE_GPU: "auto"
      POLYSCHNACK_DEFAULT_MODEL: istupakov/parakeet-tdt-0.6b-v3-onnx
      POLYSCHNACK_INFER_WORKERS: "1"
    ports:
      - "5092:5092"
    volumes:
      - ./DATA/parakeet-models:/app/models
    restart: unless-stopped
    # GPU-Zugriff: NUR über compose.gpu.yml (runtime: nvidia) — siehe dort.
    # Ohne Overlay läuft der Container CPU-only (onnxruntime-gpu fällt auf
    # CPUExecutionProvider zurück, _auto_select_model wählt das CPU-Modell).
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5092/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  crispr-diar:
    image: registry.example.com/public/polyschnack-asr-diar:latest
    environment:
      DIAR_MODEL: /models/parakeet-tdt-0.6b-v3-q8_0.gguf
    volumes:
      # rw (nicht :ro): der Entrypoint lädt ein fehlendes Modell automatisch
      # von HuggingFace in dieses Volume nach (siehe diar-service/entrypoint.sh).
      # Gemeinsamer Modell-Ordner — crispr-pk-cpp nutzt dieselbe GGUF-Datei.
      - ./DATA/models:/models
    # Kein expose/ports: nur intern im Compose-Netz erreichbar (crispr-diar:5098).
    # Am Host wird kein Port gebunden — nur asr (5092) und webapp (8088).
    restart: unless-stopped
    # GPU-Zugriff: NUR über compose.gpu.yml (runtime: nvidia) — siehe dort.
    # Ohne Overlay läuft der Container CPU-only (CrispASR ggml CPU-Backend).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5098/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # großzügig: Erststart lädt ggf. das Modell (q8_0, ~640 MB)
      start_period: 300s

  crispr-align:
    image: registry.example.com/public/polyschnack-asr-aligner:latest
    environment:
      # Forced-Aligner-Modell (qwen3-forced-aligner-0.6b-f16, ~1,8 GB).
      # Fehlt die Datei, lädt der Entrypoint sie automatisch von HuggingFace
      # nach (Volume muss ':rw' sein).
      ALIGNER_MODEL: /models/qwen3-forced-aligner-0.6b-f16.gguf
    volumes:
      - ./DATA/models:/models
    # Kein expose/ports: nur intern im Compose-Netz erreichbar
    # (crispr-align:5099). Word-Level-Alignment für Karaoke: die Webapp
    # schickt je 120-s-ASR-Chunk Audio + Segment-Text (Modell-Limit 400 s).
    restart: unless-stopped
    # GPU-Zugriff: NUR über compose.gpu.yml (runtime: nvidia) — siehe dort.
    # Ohne Overlay läuft der Container CPU-only (ggml CPU-Backend).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5099/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # großzügig: Erststart lädt ggf. das Modell (~1,8 GB)
      start_period: 300s

  ps-webapp:
    image: registry.example.com/public/polyschnack-asr-webapp:latest
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      PS_PK_ONNX_URL: "${PS_PK_ONNX_URL:-http://ps-pk-onnx:5092}"
      ASR_BACKEND: "${ASR_BACKEND:-ps-pk-onnx}"
      ASR_MODEL: istupakov/parakeet-tdt-0.6b-v3-onnx  # → GPU model
      CRISPR_DIAR_URL: "${CRISPR_DIAR_URL:-http://crispr-diar:5098}"
      # Forced-Aligner-Service (Karaoke-Word-Sync): verifiziert jede
      # Wortgrenze gegen die Akustik (crispr-align, Port 5099). Aus:
      #   POLYSCHNACK_ALIGN_WORDS: "false"
      CRISP_ALIGN_URL: "${CRISP_ALIGN_URL:-http://crispr-align:5099}"
      POLYSCHNACK_ALIGN_WORDS: "${POLYSCHNACK_ALIGN_WORDS:-true}"
      DIARIZE_METHOD: "${DIARIZE_METHOD:-pyannote}"  # pyannote|foxnose|energy|…
      DATA_DIR: /data
      # Benchmark-Seite (/benchmark): versionierte Manifeste + Audio + Ergebnisse.
      # Liegt im selben Volume wie /data (./DATA/poc-data:/data) — vor dem
      # ersten Start per Seed befüllen (siehe README "Wichtig vor dem Deployment").
      BENCHMARK_DATA_DIR: /data/benchmark
      DOCKER_PROXY_URL: http://docker-proxy:2375
      # Admin-Bereich: wer darf Services starten/stoppen und das
      # Default-Backend wechseln? Leer = Admin-Bereich deaktiviert.
      # POLYSCHNACK_ADMINS: "sub-oder-email,weiterer-user"
      # POLYSCHNACK_ADMIN_GROUPS: "admins"   # OIDC-Gruppen
      POLYSCHNACK_DEFAULT_BACKEND: "${POLYSCHNACK_DEFAULT_BACKEND:-ps-pk-onnx}"
      VAD_TRIM_SILENCE: "false"   # Set "true" to strip leading/trailing silence before ASR
      PUBLIC_RETENTION_MINUTES: "60"  # Auto-delete public recordings after N min (0=off)
      # Optional OIDC — uncomment to enable per-user workspaces.
      # WICHTIG: OIDC ist aktiv, sobald OIDC_CLIENT_ID + OIDC_ISSUER gesetzt
      # sind. Beim IdP Redirect-URI eintragen: <BASE_URL>/auth/callback.
      # SESSION_SECRET unbedingt setzen (signiert Session-Cookies).
      # Admins (Admin-Bereich) brauchen OIDC-Login + POLYSCHNACK_ADMINS/-GROUPS.
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_ISSUER: "https://auth.example.com"   # or your Keycloak/Authentik URL
      # OIDC_SCOPE: "openid profile email"    # email nötig für Admin-Match per E-Mail
      # SESSION_SECRET: "generate-a-random-secret-here"
      # BASE_URL: "https://polyschnack.example.com"
    ports:
      - "8088:8088"
    volumes:
      - ./DATA/poc-data:/data
    depends_on:
      ps-pk-onnx:
        condition: service_healthy
      crispr-diar:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
