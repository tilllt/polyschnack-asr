# PolySchnack — GPU-Overlay (NUR auf Maschinen mit NVIDIA Container Toolkit!)
#
#   docker compose -f compose.yml -f compose.gpu.yml up -d
#   (mit Backends: zusätzlich -f compose.backends.yml + Profile)
#
# Aktiviert GPU-Zugriff (runtime: nvidia) für die hybriden Services:
#   - asr:      parakeet ONNX läuft auf CUDA (POLYSCHNACK_USE_GPU=true)
#   - diar:     bewusst NICHT auf GPU — empirisch KEIN Geschwindigkeitsvorteil
#               (6× LANGSAMER, 2026-08-16-Benchmarks); läuft CPU, spart ~8,6 GB
#               VRAM für ASR + Fremdlast (Gemma4) auf der geteilten Karte
#   - asr-cpp / qwen3-asr / ark-asr: C++-Backends auf CUDA
#
# OHNE dieses Overlay laufen alle Container auf der CPU (Default) — die
# hybriden CUDA/ggml-Binaries fallen automatisch auf den CPU-Backend zurück
# (ggml_backend_init_best = CUDA > Metal > Vulkan > CPU, onnxruntime auto).
#
# Wichtig: runtime: nvidia ist hardcodiert NICHT in compose.yml/
# compose.backends.yml, weil der Stack sonst auf Maschinen ohne NVIDIA-Runtime
# gar nicht starten würde. Das Overlay ist die einzige Stelle, an der
# GPU-Zugriff vergeben wird.
#
# Achtung: Das Overlay referenziert Backend-Services (crispr-pk-cpp …),
# die nur in compose.backends.yml existieren — compose.backends.yml muss
# deshalb IMMER Teil des Projekts sein (./polyschnack-manage.sh macht das
# automatisch). Ohne aktivierte Profile starten die Backends trotzdem nicht.
services:
  ps-pk-onnx:
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr:latest
    runtime: nvidia
    environment:
      POLYSCHNACK_USE_GPU: "true"

  crispr-diar:
    # Diarization bewusst OHNE GPU (kein runtime: nvidia): empirisch belegt
    # (2026-08-16, vast.ai-Benchmarks) — ORT/GPU bringt KEINEN
    # Geschwindigkeitsvorteil, im Gegenteil: CRISPASR_TITANET_GPU=1 war 6×
    # LANGSAMER als ggml-CPU, ORT insgesamt langsamer als ggml, GPU-Batch
    # widerlegt (Task 3b). Der ORT-CUDA-EP würde sonst ~8,6 GB VRAM halten,
    # die Gemma4/ASR auf der geteilten 3090 Ti fehlen (OOM: Concat n4_2_n24).
    # Ohne runtime: nvidia fällt das ORT-Binary still auf den CPU-Backend
    # zurück (dlsym-Fallback) — schnellere Diarization UND ~8,6 GB VRAM frei.
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-diar:latest
    environment:
      # Doppelte Absicherung: ORT-CUDA-EP explizit aus (titanet.cpp liest
      # CRISPASR_ORT_FORCE_CPU) — kein GPU-Versuch, auch falls der Container
      # irgendwo doch CUDA-Zugriff bekommt.
      CRISPASR_ORT_FORCE_CPU: "1"

  crispr-align:
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-aligner:latest
    runtime: nvidia

  crispr-sep:
    # Change 172: Source-Separation (htdemucs/mel-band-roformer) läuft auf
    # CUDA — ohne runtime: nvidia crasht jeder Job mit "libcuda.so.1 not
    # found" (409), vocals fehlen, Aligner skipped auf Musik-Aufnahmen.
    image: ${REGISTRY:-ghcr.io/tilllt}/polyschnack-asr-sep:latest
    runtime: nvidia
    environment:
      # Change 175+177: htdemucs GPU-Pfad — DREI Flags nötig (CrispASR
      # src/htdemucs.cpp:647/968-981):
      #   _GPU  = Backend-Wahl (crispasr_init_gpu_backend)
      #   _GGML = Graph-Pfad aktivieren (default OFF — ohne das läuft
      #           alles auf CPU, Live-Befund 2026-08-31: 0% GPU-Util)
      #   _FUSED = Encoder+Transformer+Decoder in EINEM Graph (keine
      #           host<->device-Roundtrips; ohne FUSED ist der Graph-
      #           Pfad teils LANGSAMER als CPU)
      CRISPASR_HTDEMUCS_GPU: "1"
      CRISPASR_HTDEMUCS_GGML: "1"
      CRISPASR_HTDEMUCS_FUSED: "1"

  crispr-pk-cpp:
    runtime: nvidia

  crispr-qwen3:
    runtime: nvidia
    environment:
      QWEN_USE_VRAM: "1"

  crispr-ark:
    runtime: nvidia

  crispr-moonshine-de:
    runtime: nvidia

  crispr-canary:
    runtime: nvidia
